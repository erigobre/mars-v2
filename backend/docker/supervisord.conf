[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid

[program:php-fpm]
command=php-fpm --nodaemonize
autostart=true
autorestart=true
stderr_logfile=/var/log/php-fpm.err.log
stdout_logfile=/var/log/php-fpm.out.log

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
stderr_logfile=/var/log/nginx.err.log
stdout_logfile=/var/log/nginx.out.log

[program:queue-worker-1]
command=php /var/www/html/artisan queue:work redis --sleep=3 --quiet --timeout=90 --env=production --queue=default --tries=3
directory=/var/www/html
autostart=true
autorestart=true
user=www-data
numprocs=1
stderr_logfile=/var/log/queue-worker.err.log
stdout_logfile=/var/log/queue-worker.out.log

[program:queue-worker-2]
command=php /var/www/html/artisan queue:work redis --sleep=3 --quiet --timeout=90 --env=production --queue=default --tries=3
directory=/var/www/html
autostart=true
autorestart=true
user=www-data
numprocs=1
stderr_logfile=/var/log/queue-worker-2.err.log
stdout_logfile=/var/log/queue-worker-2.out.log
